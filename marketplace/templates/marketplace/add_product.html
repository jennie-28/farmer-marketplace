```html
{% load static %}

<!DOCTYPE html>
<html>
<head>

    <title>Add Product</title>

    <link rel="stylesheet"
          href="{% static 'marketplace/style.css' %}">

    <style>

        body {
            background-color: #9fe0b1 !important;
        }

        .add-product-box {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.15);
        }

        .add-product-box h1 {
            text-align: center;
            color: #1b5e20;
            margin-bottom: 30px;
        }

        .add-product-box label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #2e7d32;
        }

        .add-product-box input,
        .add-product-box select {
            width: 100%;
            padding: 12px;
            border: 1px solid #b7d8bd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .add-product-box input:focus,
        .add-product-box select:focus {
            outline: none;
            border-color: #2e7d32;
        }

        .add-product-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2e7d32;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-product-btn:hover {
            background: #1b5e20;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <h2>🌾 Farmer Marketplace</h2>

        <div>

            <a href="/">
                Home
            </a>

            <a href="/farmer-dashboard/">
                Dashboard
            </a>

            <a href="/my-products/">
                My Products
            </a>

            <a href="/farmer-orders/">
                Orders
            </a>

        </div>

    </div>


    <div class="add-product-box">

        <h1>🌱 Add New Product</h1>

        <form method="POST">

            {% csrf_token %}

            <label>
                Product Name
            </label>

            <input
                type="text"
                name="product_name"
                placeholder="Example: Tomato"
                required
            >


            <label>
                Category
            </label>

            <input
                type="text"
                name="category"
                placeholder="Example: Vegetable"
                required
            >


            <label>
                Price
            </label>

            <input
                type="number"
                name="price"
                placeholder="Enter price"
                min="1"
                required
            >


            <label>
                Quantity
            </label>

            <input
                type="number"
                name="quantity"
                placeholder="Enter available quantity"
                min="1"
                required
            >


            <button
                type="submit"
                class="add-product-btn">

                ➕ Add Product

            </button>

        </form>


        <a
            href="/farmer-dashboard/"
            class="back-link">

            ⬅ Back to Dashboard

        </a>

    </div>


    <div class="footer">

        🌾 Farmer Marketplace
        | Fresh • Local • Direct

    </div>

</body>
</html>
```
